[package]
name = "a3-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "a3-admin"
path = "src/bin/a3-admin.rs"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
base64 = "0.22"
regex = "1"
once_cell = "1"
calamine = "0.38"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
pdfium-render = { version = "0.9", default-features = false, features = ["image_025", "pdfium_latest", "thread_safe"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
docx-rs = "0.4"
mail-parser = "0.11"
cfb = "0.10"
html-escape = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
