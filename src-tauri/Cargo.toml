[package]
name = "a3-sheet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A3 Sheet"

[lib]
name = "a3_sheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "a3-sheet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
a3-core = { path = "../crates/a3-core" }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2.6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
url = "2"
sqlx = { version = "0.9", default-features = false, features = ["postgres"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
